<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
</head>

<body>

    <h1>My Task Manager</h1>

    <form action="/add" method="POST">
        <input
            type="text"
            name="task"
            placeholder="Enter a task"
            required
        >

        <button type="submit">Add Task</button>
    </form>

    <h2>Tasks</h2>

    <ul>
        {% for task in tasks %}
            <li>
                {{ task }}

                <a href="/delete/{{ loop.index0 }}">
                    Delete
                </a>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
